[theme]
# Design „Navy · Seitenleiste“: ruhiges Navy, neutrale Grautöne, Rot nur für Werte unter Plan
base = "light"
primaryColor = "#0F2A4A"
backgroundColor = "#F6F7F9"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0F2A4A"
font = "sans serif"
borderColor = "#E3E7ED"
baseRadius = "medium"
redColor = "#B42318"

[theme.sidebar]
backgroundColor = "#0F2A4A"
secondaryBackgroundColor = "#1B3A60"
textColor = "#DCE3EC"

[server]
maxUploadSize = 20   # MB; passt zu UPLOAD_MAX_MB in app.py und zum Hinweis im Upload-Feld

[browser]
gatherUsageStats = false
